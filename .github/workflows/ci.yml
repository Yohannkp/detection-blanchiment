name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests Go (unitaires + intégration Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion/go.mod
          cache-dependency-path: ingestion/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

  bout-en-bout:
    name: Bout en bout (Docker Compose)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion/go.mod
          cache-dependency-path: ingestion/go.sum
      - run: docker compose up -d --build redpanda postgres ingestion
      - run: bash scripts/verifier_bout_en_bout.sh
      - if: failure()
        run: docker compose logs
