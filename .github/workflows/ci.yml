name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests Go (unitaires + intégration Postgres et Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion/go.mod
          cache-dependency-path: ingestion/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          TEST_REDIS_URL: redis://localhost:6379/15

  preparation:
    name: Données AMLworld, variables anti-fuite et scoreur (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests

  bout-en-bout:
    name: Bout en bout (Docker Compose)
    runs-on: ubuntu-latest
    needs: [tests, preparation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion/go.mod
          cache-dependency-path: ingestion/go.sum
      - run: docker compose up -d --build redpanda postgres ingestion neo4j graph-sink redis detecteur
      - run: bash scripts/verifier_bout_en_bout.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rejeu AMLworld (extrait de test) puis réconciliation Postgres ↔ Neo4j
        run: |
          python outils/preparer_amlworld.py tests/fixtures/amlworld_extrait.csv --sortie /tmp/aml --voisins 100
          (cd ingestion && go run ./cmd/rejouer -fichier /tmp/aml/rejeu.csv -debit 0)
          (cd ingestion && go run ./cmd/reconcilier -attendre 90s)
          bash scripts/charger_verite.sh /tmp/aml/verite.csv
      - if: failure()
        run: docker compose logs
