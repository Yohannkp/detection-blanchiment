# Plateforme de détection du blanchiment — usage local uniquement (mots de passe de développement).
# Démarrage : docker compose up -d --build
#   Redpanda (Kafka)      localhost:19092    Schema Registry  http://localhost:18081
#   Console Redpanda      http://localhost:18088
#   Postgres (grand livre) localhost:15433   ingestion /metrics http://localhost:18090/metrics
#   Neo4j                 http://localhost:17474 (bolt 17687)   graph-sink /metrics http://localhost:18091/metrics
#   Redis (fenêtres)      localhost:16379                       détecteur /metrics http://localhost:18092/metrics

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.4
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,externe://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,externe://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,externe://0.0.0.0:18081
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18081:18081"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Topics + enregistrement du contrat de schéma (idempotent : rejouable sans erreur).
  redpanda-init:
    image: redpandadata/redpanda:v25.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./schemas:/schemas:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        X="-X brokers=redpanda:9092 -X registry.hosts=redpanda:8081"
        for t in transactions.raw transactions.dlq transactions.valid transactions.graphe alerts.aml; do
          rpk topic create $$t -p 6 $$X || true
        done
        rpk registry compatibility-level set transactions.raw-value --level BACKWARD $$X
        # Chaque version est enregistrée dans l'ordre ; le registre refuse une version incompatible.
        for v in /schemas/transaction.v*.json; do
          rpk registry schema create transactions.raw-value --schema $$v --type json $$X
        done
        rpk registry schema list $$X
    restart: "no"

  console:
    image: redpandadata/console:v3.2.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "127.0.0.1:18088:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grand_livre
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "grand_livre"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  ingestion:
    build:
      context: ./ingestion
      args: { CMD: ingestion }
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      DATABASE_URL: postgres://ingestion:ingestion@postgres:5432/grand_livre
      METRICS_ADDR: ":8090"
    ports:
      - "127.0.0.1:18090:8090"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.33-community
    environment:
      NEO4J_AUTH: neo4j/motdepasse-local  # développement local uniquement
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Alimente le graphe depuis transactions.valid (publié par l'outbox) : Postgres reste la source de vérité.
  graph-sink:
    build:
      context: ./ingestion
      args: { CMD: graphsink }
    environment:
      KAFKA_BROKERS: redpanda:9092
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: motdepasse-local
      METRICS_ADDR: ":8091"
    ports:
      - "127.0.0.1:18091:8091"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # État des fenêtres glissantes de la détection. appendonly : l'état survit à un redémarrage,
  # sinon les épisodes d'alerte en cours seraient perdus.
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  detecteur:
    build:
      context: ./ingestion
      args: { CMD: detecteur }
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://detection:detection@postgres:5432/grand_livre
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: motdepasse-local
      METRICS_ADDR: ":8092"
    ports:
      - "127.0.0.1:18092:8092"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Score (0-1) et raisons SHAP de chaque alerte, avec le modèle exporté par ml/entrainer.py.
  scoreur:
    build: ./ml
    environment:
      DATABASE_URL: postgresql://scoreur:scoreur@postgres:5432/grand_livre
      MODELE: /app/modeles/production
    volumes:
      - ./modeles:/app/modeles:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["modele"]  # démarre seulement si un modèle est entraîné : docker compose --profile modele up -d

volumes:
  redpanda:
  postgres:
  neo4j:
  redis:
